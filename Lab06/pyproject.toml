[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-finance"
version = "0.1.0"
description = "Reliable data import, export, and error handling for financial tracker"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: integration tests",
]

[tool.coverage.run]
branch = true
source = ["reliable_finance"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80